name: Bug report
description: Report broken or unexpected Image Curator behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough detail to reproduce it safely.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken or unexpected?
      placeholder: The batch sidebar does not load after...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact actions needed to trigger the issue.
      placeholder: |
        1. Start the app with ...
        2. Open ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include non-sensitive error text if available.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Web UI
        - Flask API
        - Batch filesystem workflow
        - AI scoring / queue / run history
        - CLI curate.py
        - Prompt history
        - Favorites
        - Public export
        - Documentation
        - Other / unsure
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Paste the commit hash, tag, or branch if known.
      placeholder: f8e2d20

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, browser, and deployment style if relevant.
      placeholder: Windows 11, Python 3.14, Chrome, local Flask service

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Do not include secrets, API keys, private paths, or sensitive metadata.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that may help narrow down the issue.
