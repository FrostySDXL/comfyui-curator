[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-curator"
version = "1.0.0"
description = "Operator-focused web application and curation toolkit for reviewing generated images with optional AI-assisted scoring"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "FrostySDXL" }]
dependencies = [
    "Flask>=3.1,<4.0",
    "Pillow>=10.0,<12.0",
    "python-dotenv>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/FrostySDXL/comfyui-curator"
Repository = "https://github.com/FrostySDXL/comfyui-curator"
Issues = "https://github.com/FrostySDXL/comfyui-curator/issues"

[tool.comfy]
PublisherId = "FrostySDXL"
DisplayName = "ComfyUI Curator"
Icon = "https://raw.githubusercontent.com/FrostySDXL/comfyui-curator/master/assets/icon.png"
Banner = "https://raw.githubusercontent.com/FrostySDXL/comfyui-curator/master/assets/banner.png"
requires-comfyui = ">=0.19.5"

[tool.setuptools.packages.find]
include = ["image_curator*", "ai_curate*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "venv", "__pycache__", ".git"]

[tool.ruff.lint.per-file-ignores]
# app.py and curate.py call load_dotenv() before importing application
# modules that read environment variables at import time. The non-top
# import order is intentional and required for the .env configuration to
# be visible during import.
"app.py" = ["E402"]
"curate.py" = ["E402"]
# Test files commonly put `pytestmark = pytest.mark.<layer>` between
# stdlib and third-party imports. Allowing it here keeps the marker
# visible at the top of the file without an E402 per line.
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
warn_unused_configs = true
ignore_missing_imports = true
